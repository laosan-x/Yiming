name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: cargo build --release
        run: cargo build --release

      - name: Stage installer payload
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          $stage = "dist/cocole-iced-v$env:V-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/icons", "$stage/ort-libs", "$stage/models" | Out-Null
          Copy-Item target/release/cocole-iced.exe $stage/
          Copy-Item icons/* $stage/icons/
          # onnxruntime DLL (load-dynamic)
          $ver = "1.22.0"
          curl.exe -sL -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-$ver.zip"
          Expand-Archive ort.zip -DestinationPath ort-tmp -Force
          Copy-Item "ort-tmp/onnxruntime-win-x64-$ver/lib/onnxruntime.dll" $stage/ort-libs/
          # bundled models: only the light trio (~30 MB); heavy models
          # (BiRefNet 927MB / BEN2 212MB / isnet 170MB) users fetch via
          # models/download.ps1 and drop into models/ (app scans the dir)
          pwsh -File models/download.ps1 -Dir "$stage/models" -Only yunet
          pwsh -File models/download.ps1 -Dir "$stage/models" -Only u2netp
          pwsh -File models/download.ps1 -Dir "$stage/models" -Only modnet

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: pwsh

      - name: Build NSIS installer
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          $define = "-DAPP_VERSION=" + $env:V
          Write-Host "makensis define: $define"
          & $nsis $define installer.nsi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WonderLand ${{ github.ref_name }}
          body: |
            壹鸣 WonderLand ${{ github.ref_name }}

            - 安装包：cocole-iced-v${{ steps.ver.outputs.version }}-setup.exe（内置 3 个轻量模型：YuNet 人脸检测 / MODNet / U²-NetP，约 100 MB）
            - 高精度大模型（BiRefNet / BEN2 / InSPyReNet）不随包分发，运行 `models/download.ps1` 下载后放入 `models/` 即可，应用会自动识别

            完整变更见「设置 → 更新日志」。
          files: dist/cocole-iced-v${{ steps.ver.outputs.version }}-setup.exe
          fail_on_unmatched_files: true
