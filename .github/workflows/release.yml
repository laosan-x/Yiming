# 发版 SOP（v0.4.5 起）
#   1. 本地只改：Cargo.toml / README / 设置页 changelog + i18n / release-notes.txt
#      **不要手改 update-manifest.json**：main 上必须始终是上一版的完整清单，
#      这样 CI 构建期间旧版客户端只会看到「已是最新」，不会读到 PENDING 摘要。
#   2. git tag -a vX.Y.Z && git push origin main && git push origin vX.Y.Z
#   3. 本工作流：门禁 → 构建 → 发布 Release → 从安装包全量生成清单并 push main
#   4. push main 自动触发 purge-cdn.yml：确认 GitHub 同步后 purge 并校验 CDN
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate — release version consistency
        run: python scripts/check-release.py

      # ci.yml 只在 push main / PR 时触发，tag push 不触发。发版必须自带门禁，
      # 否则打错 commit 或测试挂掉仍会照常发布。
      - name: Gate — cargo test
        run: cargo test

      - name: Gate — cargo clippy
        run: cargo clippy --all-targets

      - name: cargo build --release
        run: cargo build --release

      - name: Stage installer payload
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          $stage = "dist/cocole-iced-v$env:V-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/icons", "$stage/ort-libs", "$stage/models" | Out-Null
          Copy-Item target/release/cocole-iced.exe $stage/
          Copy-Item icons/* $stage/icons/
          # onnxruntime DLL (load-dynamic). MUST be the DirectML distribution
          # (NuGet Microsoft.ML.OnnxRuntime.DirectML): the plain win-x64 CPU
          # zip's DML EP registers OK but silently returns constant garbage
          # for FP16 models on both GPU and CPU (verified via probe matrix).
          # The DirectML DLL matches the dev machine's ort-libs (md5 ef6a6a5c).
          curl.exe -sL -o ort-nupkg.zip "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.22.0/microsoft.ml.onnxruntime.directml.1.22.0.nupkg"
          Expand-Archive ort-nupkg.zip -DestinationPath ort-tmp -Force
          Copy-Item "ort-tmp/runtimes/win-x64/native/onnxruntime.dll" $stage/ort-libs/
          Copy-Item "ort-tmp/runtimes/win-x64/native/onnxruntime_providers_shared.dll" $stage/ort-libs/
          # bundled models: only the light trio (~30 MB); heavy models
          # (BiRefNet 927MB / BEN2 212MB / isnet 170MB) users fetch via
          # models/download.ps1 and drop into models/ (app scans the dir)
          pwsh -File models/download.ps1 -Dir "$stage/models" -Only yunet
          pwsh -File models/download.ps1 -Dir "$stage/models" -Only u2netp
          pwsh -File models/download.ps1 -Dir "$stage/models" -Only modnet

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: pwsh

      - name: Build NSIS installer
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          $define = "-DAPP_VERSION=" + $env:V
          Write-Host "makensis define: $define"
          & $nsis $define installer.nsi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WonderLand ${{ github.ref_name }}
          body: |
            壹鸣 WonderLand ${{ github.ref_name }}

            - 安装包：cocole-iced-v${{ steps.ver.outputs.version }}-setup.exe（内置 3 个轻量模型：YuNet 人脸检测 / MODNet / U²-NetP，约 40 MB）
            - 高精度大模型（BiRefNet / BEN2 / InSPyReNet）不随包分发，运行 `models/download.ps1` 下载后放入 `models/` 即可，应用会自动识别

            完整变更见「设置 → 更新日志」。
          files: dist/cocole-iced-v${{ steps.ver.outputs.version }}-setup.exe
          fail_on_unmatched_files: true

      # ── 更新清单：CI 全量生成，不再有 PENDING 骨架窗口 ──────────────
      # main 上的清单在构建期间始终是「上一个已发布版本」的完整清单，
      # 旧版客户端只会看到「已是最新版本」，不会拿到 PENDING 摘要白下载。
      # 本步骤产出的 push 会触发 purge-cdn.yml 刷新 CDN 并做一致性校验，
      # 故这里不再单独 purge（同路径短时间内重复 purge 会被 jsDelivr 限流）。
      - name: Generate full update manifest from built installer
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          python scripts/gen_manifest.py \
            --version "$V" \
            --notes-file release-notes.txt \
            --asset "dist/cocole-iced-v$V-setup.exe" \
            --repo "${GITHUB_REPOSITORY}"
          cp update-manifest.json "$RUNNER_TEMP/update-manifest.json"

      - name: Publish manifest to main
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          # tag checkout 处于 detached HEAD；基于最新 main 建临时分支提交，
          # 避免构建期间 main 前进导致 rebase 冲突或 push 被拒。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B ci-manifest origin/main
          cp "$RUNNER_TEMP/update-manifest.json" update-manifest.json
          if git diff --quiet -- update-manifest.json; then
            echo "manifest unchanged, nothing to publish"
            exit 0
          fi
          git add update-manifest.json
          git commit -m "manifest: v$V 全量生成 size + sha256 (CI 自动)"
          git push origin ci-manifest:main
