name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets

      # 测试资产（models/u2netp.onnx 4.4MB + ort-libs/onnxruntime.dll 16MB）已入库
      # （.gitignore 白名单），checkout 即得，不再联网下载。
      # 2026-11-21 三次 CI 连续挂在 runner 下载 github release 大文件，故此固化。

      - name: cargo test
        run: cargo test
